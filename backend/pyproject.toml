[project]
name = "mcp-test-tool"
version = "0.2.0"
description = "MCP Server Test & Debug Tool - Backend API"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.30.0",
    "websockets>=12.0",
    "mcp>=1.0.0",
    "pydantic>=2.0",
    "httpx>=0.27",
    "aiosqlite>=0.20",
    "plotly>=5.0",
    "jsonschema>=4.0",
    "pandas>=2.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
    "ruff>=0.4.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
