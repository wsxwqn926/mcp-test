[project]
name = "mcp-test-tool"
version = "0.1.0"
description = "MCP Server 测试调试工具 - 可视化 Web 客户端"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "mcp>=1.0.0",
    "streamlit>=1.40.0",
    "pydantic>=2.0",
    "httpx>=0.27",
    "aiosqlite>=0.20",
    "plotly>=5.0",
    "jsonschema>=4.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
    "ruff>=0.4.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "N", "W"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
